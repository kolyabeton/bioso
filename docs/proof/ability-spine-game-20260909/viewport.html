<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BIOSO — проверка игрового экрана веток</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#131914}
    iframe{position:fixed;left:50%;top:12px;width:var(--proof-width);height:var(--proof-height);border:0;transform:translateX(-50%) scale(var(--proof-scale));transform-origin:top center;box-shadow:0 18px 60px #0009;background:#111}
  </style>
</head>
<body>
  <iframe title="Игровой маршрут развития способности"></iframe>
  <script>
    const query=new URLSearchParams(location.search),width=Number(query.get('width'))||390,height=Number(query.get('height'))||844;
    document.documentElement.style.setProperty('--proof-width',`${width}px`);
    document.documentElement.style.setProperty('--proof-height',`${height}px`);
    document.documentElement.style.setProperty('--proof-scale',String(Math.min(1,(innerWidth-24)/width,(innerHeight-24)/height)));
    const frame=document.querySelector('iframe');frame.src=`/?review=ability-detail&lang=ru&branch=${encodeURIComponent(query.get('branch')||'cryotrail')}`;
    if(query.get('probe')==='1')frame.addEventListener('load',()=>setTimeout(async()=>{
      const doc=frame.contentDocument,rail=doc.querySelector('.ui-branch-options');rail.scrollTop=Math.min(180,rail.scrollHeight-rail.clientHeight);
      const railTop=rail.scrollTop,target=doc.querySelector('[data-action="soul-branch"][data-id="fire"]');target.click();await new Promise(resolve=>setTimeout(resolve,80));
      const railStable=rail===doc.querySelector('.ui-branch-options')&&Math.abs(rail.scrollTop-railTop)<1,tree=doc.querySelector('.ui-ability-tree-scroll');tree.scrollTop=Math.min(70,tree.scrollHeight-tree.clientHeight);
      const treeTop=tree.scrollTop,node=doc.querySelectorAll('[data-action="ability-node"]')[1];node.click();await new Promise(resolve=>setTimeout(resolve,80));
      const sameTree=tree===doc.querySelector('.ui-ability-tree-scroll'),treeAfter=tree.scrollTop,treeStable=sameTree&&Math.abs(treeAfter-treeTop)<1;
      document.title=`${railStable&&treeStable?'PASS':'FAIL'} · rail:${railStable} · tree:${treeStable} · ${treeTop}/${treeAfter} · same:${sameTree}`;
    },900));
  </script>
</body>
</html>
