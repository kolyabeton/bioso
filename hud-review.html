<!doctype html>
<html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIOSO — HUD review, не игровая сборка</title><link rel="stylesheet" href="/src/painterly.css"><link rel="stylesheet" href="/src/reference-hud.css"></head><body>
<aside class="editorial"><span class="eyebrow">ОТДЕЛЬНОЕ ПРЕВЬЮ HUD</span><h1>BIOSO</h1><p class="notes">Тёмное стекло · бронза<br>Срезанные углы · предметные иконки</p><p class="notes">Демонстрационные значения.<br>Не подключено к основной игре.</p></aside>
<main id="game" aria-label="Предпросмотр HUD">
<svg class="hud-symbols" aria-hidden="true"><defs><g id="module-frame"><path class="rim" d="M8 1H92L99 8V92L92 99H8L1 92V8Z"/><path class="inner-rim" d="M10 5H90L95 10V90L90 95H10L5 90V10Z"/><path class="edge-light" d="M4 15V9L10 3H90L97 10M4 84V91L10 97H37"/></g></defs></svg>
<div class="landscape"></div><div class="atmosphere"></div>
<header class="hud"><div class="location"><span class="eyebrow">01 / КИНО</span><span class="hud-brand">BIOSO</span><strong>ВЕРХНИЕ САДЫ</strong></div><div class="timer-plate"><svg class="slot-frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><use href="#module-frame"/></svg><span id="timer" aria-label="Демонстрационное время">08:24</span></div><button id="pause" class="icon-button" aria-label="Пауза превью">Ⅱ</button></header>
<div class="vitals"><div class="health-shell"><div class="health" role="progressbar" aria-label="Демонстрационное здоровье" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="health-fill"></i></div></div><div class="resource"><svg class="resource-crystal" viewBox="0 0 30 36" aria-hidden="true"><path d="M15 1L28 10L25 26L15 35L3 25L1 11Z" fill="#74bda16b" stroke="#a4e7c8"/><path d="M15 1L10 15L15 35L22 20Z" fill="#a7e7c6"/></svg><b id="cells">128</b></div></div>
<div id="toast" role="status"></div>
<div class="bottom-hud"><div class="module-dock"><div class="parts" role="group" aria-label="Предпросмотр модулей">
<button data-part="arc" aria-pressed="true" class="selected" aria-label="Нервная дуга"><svg class="slot-frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><use href="#module-frame"/></svg><span class="module-tier" aria-hidden="true">I</span><span class="module-art" data-art="arc" aria-hidden="true"></span><span class="module-name">Нервная дуга</span><i class="charge" aria-hidden="true"></i></button><button data-part="seed" aria-pressed="false"  aria-label="Семенная пушка"><svg class="slot-frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><use href="#module-frame"/></svg><span class="module-tier" aria-hidden="true">I</span><span class="module-art" data-art="seed" aria-hidden="true"></span><span class="module-name">Семенная пушка</span><i class="charge" aria-hidden="true"></i></button><button data-part="pulse" aria-pressed="false"  aria-label="Импульсное сердце"><svg class="slot-frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><use href="#module-frame"/></svg><span class="module-tier" aria-hidden="true">I</span><span class="module-art" data-art="pulse" aria-hidden="true"></span><span class="module-name">Импульсное сердце</span><i class="charge" aria-hidden="true"></i></button>
</div><div class="core-status" aria-label="Ядро"><svg class="slot-frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><use href="#module-frame"/></svg><span class="module-tier" aria-hidden="true">I</span><span class="module-art" data-art="core" aria-hidden="true"></span><span class="module-name">Ядро</span><i id="core-charge" aria-hidden="true"></i></div></div><p class="gesture-hint">ДВИЖЕНИЕ ОДНИМ ПАЛЬЦЕМ</p></div>
</main>
<script type="module">
const game=document.querySelector('#game');game.style.setProperty('--core-ready','65%');let timer;
for(const button of document.querySelectorAll('[data-part]'))button.onclick=()=>{document.querySelectorAll('[data-part]').forEach(b=>{b.classList.toggle('selected',b===button);b.setAttribute('aria-pressed',String(b===button));});const toast=document.querySelector('#toast');toast.textContent=button.getAttribute('aria-label')+' · предпросмотр';toast.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('visible'),1200);};
document.querySelector('#pause').onclick=e=>{const b=e.currentTarget,paused=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!paused));b.textContent=paused?'Ⅱ':'▷';};
</script></body></html>
