<!doctype html><html lang="ru"><meta charset="utf-8"><title>Диагностика огненного круга</title>
<style>body{margin:0;background:#17201e;color:#eee;font:16px system-ui}header{padding:16px}main{display:flex}section{width:25%;text-align:center}canvas{width:100%;height:420px}small{display:block;color:#aabbaf}button{margin:8px;padding:8px}</style>
<header>Изолированное сравнение текущих игровых эффектов · без звука и сохранений</header><main></main><button id="rerun">Повторить</button><output id="status"></output>
<script type="module">
import * as T from 'three';
import {createSoulFxView} from '/src/systems/soul-fx-view.js';
import {createRocketExplosionView} from '/src/rocket-explosion-view.js';
import {createRun} from '/src/game.js';
const cases=[['Подготовка самоподрыва','volatileCharge'],['Самоподрыв','volatile-blast'],['Взрыв ракеты','blast / rocket'],['Баг Землекопа','224 повторных самоподрыва']];
const views=cases.map(([name,key],i)=>{const section=document.createElement('section');section.innerHTML=`<h3>${name}</h3><small>${key}</small><canvas></canvas>`;document.querySelector('main').append(section);const canvas=section.querySelector('canvas'),r=new T.WebGLRenderer({canvas,antialias:true});r.setSize(section.clientWidth,420,false);r.setPixelRatio(1);const scene=new T.Scene();scene.background=new T.Color('#26302e');const camera=new T.OrthographicCamera(-5*section.clientWidth/420,5*section.clientWidth/420,5,-5,.1,80);camera.position.set(0,14,10);camera.lookAt(0,0,0);const ground=new T.Mesh(new T.PlaneGeometry(30,30).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:'#303b37'}));scene.add(ground);scene.add(new T.HemisphereLight(0xffffff,0x223322,2));const body=new T.Mesh(new T.SphereGeometry(.45,20,14),new T.MeshStandardMaterial({color:'#ded9c7',roughness:.8}));body.position.y=.55;scene.add(body);const soul=createSoulFxView(scene),rocket=createRocketExplosionView(scene),s=createRun();s.player={...s.player,x:0,y:0,z:4};s.enemies=[{id:1,x:0,y:0,z:0,hp:100,radius:.5,volatile:true,fuseRemaining:1.6}];return {r,scene,camera,soul,rocket,s,body,i};});
function run(){for(const v of views){v.soul.reset();v.rocket.reset();v.body.visible=v.i!==1;if(v.i===0){for(let j=0;j<53;j++){v.s.enemies[0].fuseRemaining=1.6-j/60;v.soul.update(1/60,false,v.s);}}else if(v.i===1){v.soul.event({type:'volatile-blast',x:0,y:0,z:0,radius:3.2});v.soul.update(Number(new URLSearchParams(location.search).get('age')||.16),false);}else if(v.i===3){v.body.visible=false;for(let j=0;j<224;j++){v.soul.event({type:'volatile-blast',x:0,y:0,z:0,radius:3.2});v.soul.update(1/60,false);}}else{v.rocket.event({type:'blast',key:'rocket',x:0,y:0,z:0,radius:1.5});v.rocket.update(.1,false);}v.r.render(v.scene,v.camera);}document.querySelector('#status').textContent='Готово · одиночные эффекты и воспроизведение 224 взрывов по одному на кадр (60 FPS)';}document.querySelector('#rerun').onclick=run;run();
</script></html>
