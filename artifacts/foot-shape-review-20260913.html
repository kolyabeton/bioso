<!doctype html><meta charset="utf-8"><title>BIOSO — пальцы ног</title>
<style>body{margin:18px;background:#202c27;color:#e0dfcd;font:14px system-ui}h1{font-size:23px;margin:8px 0}p{color:#bec7bb}main{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:12px}article{background:#303d35;padding:12px;border-radius:8px}h2{font-size:17px;margin:0 0 6px}.pair{display:flex;justify-content:space-around;align-items:center;height:210px}.ui-part-art{display:block;width:160px;height:200px;background-repeat:no-repeat}.ui-part-art svg{width:100%;height:100%}.full{width:170px;height:205px;object-fit:contain}.foot{width:100%;height:170px;object-fit:contain;background:#243029;border-radius:6px}small{color:#bec7bb}a{color:#bfd9c7}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(280px,1fr))}}</style>
<h1>BIOSO · Пальцы по иконкам</h1><p>Слева — игровая иконка. Справа — текущая нога. Ниже — стопа крупно.</p><div id="status">Загрузка…</div><main></main>
<script type="module">
import * as T from 'three';
import {loadModel,fittedModel,LEG_MODELS} from '/src/asset-models.js';
import {equipmentMaterialsReady} from '/src/creature-materials.js';
import {partArt} from '/src/ui/molecules.js';
import {CATALOG} from '/src/catalog.js';
const scene=new T.Scene(),renderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(400,480);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;scene.add(new T.HemisphereLight('#fff3da','#657c73',2));const sun=new T.DirectionalLight('#fff3db',3);sun.position.set(-3,5,4);scene.add(sun);
const camera=new T.OrthographicCamera(-.85,.85,1.02,-1.02,.01,30);camera.position.set(2,1.2,4);camera.lookAt(0,0,0);const footCamera=new T.OrthographicCamera(-.33,.33,.20,-.20,.01,30);footCamera.position.set(.50,-.64,1.1);footCamera.lookAt(0,-1.26,.23);
await equipmentMaterialsReady;let count=0;
for(const key of ['spring','runner','universal','plated','swarmLeg']){const id=new URLSearchParams(location.search).has('candidate')?`leg-${key}-icon-v2`:LEG_MODELS[key][0];const el=document.createElement('article');el.innerHTML=`<h2>${CATALOG[key].name}</h2><div class="pair">${partArt(key)}<img class="full" alt="Модель ${CATALOG[key].name}"></div><img class="foot" alt="Пальцы ${CATALOG[key].name}"><small>${id}</small>`;document.querySelector('main').append(el);const model=await loadModel(id);if(!model){el.append('ОШИБКА');continue;}renderer.setSize(400,480);const fit=fittedModel(model,{size:1.6,rotation:[0,Math.PI,0]});scene.add(fit);renderer.render(scene,camera);el.querySelector('.full').src=renderer.domElement.toDataURL();scene.remove(fit);const foot=model.clone(true);foot.rotation.y=Math.PI;scene.add(foot);renderer.setSize(560,340);renderer.render(scene,footCamera);el.querySelector('.foot').src=renderer.domElement.toDataURL();scene.remove(foot);count++;}document.querySelector('#status').textContent=`Загружено ${count}/5`;renderer.dispose();renderer.forceContextLoss();
</script>
