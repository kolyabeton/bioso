<!doctype html><meta charset="utf-8"><title>BIOSO — сверка конечностей</title>
<style>body{margin:24px;background:#182320;color:#dedfd0;font:14px system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px}article{background:#293630;padding:12px;border-radius:8px}h2{font-size:15px;margin:0 0 6px}small{color:#afbaac}.pair{display:flex;align-items:center;justify-content:space-around;height:170px}.ui-part-art{display:block;width:140px;height:150px;background-repeat:no-repeat}.ui-part-art svg{width:100%;height:100%}img{width:150px;height:170px;object-fit:contain}a{color:#b4d6be}#status{margin-bottom:16px}@media(max-width:700px){main{grid-template-columns:1fr 1fr}.pair{height:145px}.ui-part-art,img{width:110px;height:140px}}</style>
<h1>BIOSO · Иконка / текущая 3D-модель</h1><p>Канонические иконки и модели из игровых маппингов. Один масштаб показа по габариту, без изменения геометрии.</p><div id="status">Загрузка…</div><main></main>
<script type="module">
import * as T from 'three';
import {ARM_MODELS,LEG_MODELS,loadModel,fittedModel} from '/src/asset-models.js';
import {equipmentMaterialsReady} from '/src/creature-materials.js';
import {partArt} from '/src/ui/molecules.js';
import {CATALOG} from '/src/catalog.js';
const scene=new T.Scene(),renderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(300,340);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
scene.add(new T.HemisphereLight('#fff3da','#657c73',2));const sun=new T.DirectionalLight('#fff3db',3);sun.position.set(-3,5,4);scene.add(sun);
const camera=new T.OrthographicCamera(-.9,.9,1.02,-1.02,.01,30);camera.position.set(2,1.2,4);camera.lookAt(0,0,0);
await equipmentMaterialsReady;let count=0;
for(const [key,[currentId]] of Object.entries({...ARM_MODELS,...LEG_MODELS})){
const id=new URLSearchParams(location.search).has('candidate')&&!['pistol','shotgun','root'].includes(key)?`${LEG_MODELS[key]?'leg':'arm'}-${key}-icon-v1`:currentId;
const card=document.createElement('article');card.dataset.key=key;card.innerHTML=`<h2>${CATALOG[key].name}</h2><small>${key} · ${id}</small><div class="pair">${partArt(key)}<img alt="3D ${CATALOG[key].name}"></div>`;document.querySelector('main').append(card);
const model=await loadModel(id);if(!model){card.append('ОШИБКА ЗАГРУЗКИ');continue}const fit=fittedModel(model,{size:1.6,rotation:[0,Math.PI,0]});scene.add(fit);renderer.render(scene,camera);card.querySelector('img').src=renderer.domElement.toDataURL();scene.remove(fit);count++;
}document.querySelector('#status').textContent=`Загружено ${count}/20 моделей`;renderer.dispose();renderer.forceContextLoss();
</script>
